<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Academy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!--
    The sandbox intentionally omits `allow-modals`, which prevents the
    embedded page from opening blocking alert/confirm/prompt dialogs.
    The other permissions keep the app's normal scripts, forms, storage,
    and popups working.
  -->
  <iframe
    src="https://doge-gules-nine.vercel.app/"
    title="Khan Academy"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"
  ></iframe>
  <script>
    // Also silence dialogs created by this wrapper page itself.
    window.alert = () => {};
    window.confirm = () => false;
    window.prompt = () => null;

    document.addEventListener('keydown', e => { if (e.key === '/') window.close(); });
  </script>
</body>
</html>
