<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>300+ Games | mathstudies</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="game-library" src="/games/" title="300+ game library"></iframe>
  <script>
    const library = document.getElementById('game-library');
    library.addEventListener('load', () => {
      // Static preview servers do not run the serverless proxy. Fall back to
      // the original embed there; deployed Vercel uses the same-origin route.
      try {
        const text = library.contentDocument?.body?.textContent || '';
        if (/Cannot GET|NOT_FOUND|Page not found/i.test(text)) {
          library.src = 'https://hashed101.netlify.app/';
        }
      } catch {}
    });
    document.addEventListener('keydown', event => { if (event.key === '/') window.close(); });
  </script>
</body>
</html>
