<iframe src="https://glacierarcade.win/" width="100%" height="100%" style="border: none;"></iframe>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>

<script>
  if (window === window.top) {
    document.body.addEventListener('keydown', (event) => {
      if (event.key === '/') {
        window.close()
      }
    });
  } else {
    window.parent.document.body.addEventListener('keydown', (event) => {
      if (event.key === '/') {
        window.close()
      }
    });
  }
</script>
