<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Suggest Something | mathstudies</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { height: 100svh; overflow: hidden; }
    .page { display: flex; flex-direction: column; height: 100svh; padding-bottom: 24px; }
    .title { margin-top: 48px; }
    .frame { flex: 1; min-height: 0; margin-top: 32px; }
    @media (max-width: 520px) { .title { margin-top: 36px; } .frame { margin-top: 24px; } }
  </style>
</head>
<body>
  <main class="page wide">
    <div class="top">
      <span><a class="link" href="home.html">mathstudies</a> / suggest</span>
      <a class="link" href="home.html">home</a>
    </div>

    <h1 class="title">Suggest something</h1>
    <p class="note">Submit an idea or report a link that needs fixing. The sheet below updates automatically.</p>
    <div class="actions">
      <a class="btn solid" href="https://forms.gle/Jizs131fZeHQGVzN8" target="_blank" rel="noopener">Open suggest form ↗</a>
      <button class="btn" type="button" onclick="reloadFrame()">Refresh sheet</button>
    </div>

    <section class="frame" aria-label="Suggestion spreadsheet">
      <div class="loading" id="loader">loading spreadsheet…</div>
      <iframe id="info" src="about:blank" title="Suggestions" onload="onFrameLoad()"></iframe>
    </section>
  </main>
  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRMacIskOWkdiC8zzP4HYp6qxqxSBYJMrSOjmb-TqCo2J1RbizwqUSZ4Siljwa0Jztyae4ehjrEyLG/pubhtml?widget=true&headers=false';
    let sheetLoaded = false;
    function onFrameLoad() {
      const frame = document.getElementById('info');
      if (!sheetLoaded) { frame.src = SHEET_URL; sheetLoaded = true; }
      else { document.getElementById('loader').hidden = true; }
    }
    function reloadFrame() {
      document.getElementById('loader').hidden = false;
      document.getElementById('info').src = SHEET_URL + '&refresh=' + Date.now();
    }
  </script>
</body>
</html>
