<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Suggest Something | mathstudies</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    .suggest-header { padding-top: 30px; padding-bottom: 24px; }
    .suggest-header h1 { font-size: clamp(2rem, 5vw, 3.4rem); }
    .suggest-header p { max-width: 620px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .embed-container { position: relative; flex: 1 1 auto; min-height: 0; }
    .embed-container iframe { width: 100%; height: 100%; border: 0; background: white; }
    .loader { position: absolute; inset: 50% auto auto 50%; z-index: 1; color: #777; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body class="suggest-page">
  <main class="center-stack">
    <header class="suggest-header">
      <h1>Suggest something</h1>
      <p>Submit an idea or report a link that needs fixing. The sheet below updates automatically.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://forms.gle/Jizs131fZeHQGVzN8" target="_blank" rel="noopener">Open suggest form ↗</a>
        <button class="btn" type="button" onclick="reloadFrame()">Refresh sheet</button>
      </div>
    </header>
    <section class="embed-container" aria-label="Suggestion spreadsheet">
      <div class="loader" id="loader">Loading spreadsheet…</div>
      <iframe id="info" src="about:blank" title="Suggestions" onload="onFrameLoad()"></iframe>
    </section>
  </main>
  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRMacIskOWkdiC8zzP4HYp6qxqxSBYJMrSOjmb-TqCo2J1RbizwqUSZ4Siljwa0Jztyae4ehjrEyLG/pubhtml?widget=true&headers=false';
    let sheetLoaded = false;
    function onFrameLoad() {
      const frame = document.getElementById('info');
      if (!sheetLoaded) { frame.src = SHEET_URL; sheetLoaded = true; }
      else { document.getElementById('loader').hidden = true; }
    }
    function reloadFrame() {
      document.getElementById('loader').hidden = false;
      document.getElementById('info').src = SHEET_URL + '&refresh=' + Date.now();
    }
  </script>
</body>
</html>
