<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager</title>
  <link rel="stylesheet" href="../../pages.css">
  <style>
    body { display: grid; place-items: center; padding: 24px; }
    .card { width: min(100%, 340px); }
    .card h2 { margin: 0 0 20px; font-size: 24px; font-weight: 500; letter-spacing: -.03em; }
    label { display: block; margin: 0 0 6px; font-family: var(--mono); font-size: 11px; color: var(--mute); }
    input[type="password"] {
      width: 100%;
      height: 40px;
      margin-bottom: 16px;
      padding: 0 12px;
      border: 1px solid var(--line-hot);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color .15s var(--ease);
    }
    input[type="password"]:focus { border-color: var(--accent); }
    .card .btn { width: 100%; justify-content: center; height: 40px; margin-top: 4px; }
    .card .btn + .btn { margin-top: 8px; }
    .btn.quiet { border-color: transparent; color: var(--mute); }
    .btn.quiet:hover { color: var(--text); background: var(--panel); }
    #changeSection { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div id="setSection">
      <h2>Set a password</h2>
      <label for="passwordInput">password</label>
      <input type="password" id="passwordInput">
      <button class="btn solid" onclick="setPassword()">Set password</button>
    </div>

    <div id="changeSection">
      <h2>Change password</h2>
      <label for="oldPasswordInput">old password</label>
      <input type="password" id="oldPasswordInput">
      <label for="newPasswordInput">new password</label>
      <input type="password" id="newPasswordInput">
      <button class="btn solid" onclick="changePassword()">Change password</button>
      <button class="btn quiet" onclick="clearPassword()">Clear password</button>
    </div>
  </main>

  <script>
    function setPassword() {
      const pw = document.getElementById('passwordInput').value;
      localStorage.setItem('password', pw);
      alert('Done! Return here to clear or change your password.');
      location.href = '//mathstudies.replit.app';
    }

    function changePassword() {
      const old = document.getElementById('oldPasswordInput').value;
      const nw = document.getElementById('newPasswordInput').value;
      if (old === localStorage.getItem('password')) {
        localStorage.setItem('password', nw);
        alert('Password changed successfully!');
      } else {
        alert('Old password is incorrect.');
      }
    }

    function clearPassword() {
      localStorage.removeItem('password');
      location.reload();
    }

    window.onload = () => {
      if (localStorage.getItem('password')) {
        document.getElementById('setSection').style.display = 'none';
        document.getElementById('changeSection').style.display = 'block';
      }
    };
  </script>
</body>
</html>
