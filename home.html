<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mathstudies</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background: #090909;
      color: #f4f4f2;
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .page { width: min(100%, 920px); }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 13vw, 9.5rem);
      font-weight: 500;
      line-height: .82;
      letter-spacing: -.09em;
      cursor: pointer;
      animation: enter .8s cubic-bezier(.16,1,.3,1) both;
      transition: letter-spacing .5s cubic-bezier(.16,1,.3,1), opacity .3s ease;
    }

    h1:hover { letter-spacing: -.075em; opacity: .68; }

    .tagline {
      margin: 30px 0 64px;
      color: #666;
      font-size: 12px;
      letter-spacing: .01em;
      animation: enter .8s .08s cubic-bezier(.16,1,.3,1) both;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      animation: enter .8s .16s cubic-bezier(.16,1,.3,1) both;
    }

    nav a {
      position: relative;
      color: #9a9a98;
      font-size: 14px;
      letter-spacing: -.02em;
      text-decoration: none;
      transition: color .25s ease, transform .35s cubic-bezier(.16,1,.3,1), opacity .25s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 100%;
      bottom: -6px;
      height: 1px;
      background: #f4f4f2;
      transition: right .4s cubic-bezier(.16,1,.3,1);
    }

    nav a:hover { color: #fff; transform: translateY(-2px); }
    nav a:hover::after { right: 0; }
    nav:has(a:hover) a:not(:hover) { opacity: .28; }

    nav span { color: #292929; font-size: 11px; user-select: none; }

    .quiet {
      margin-top: 68px;
      display: flex;
      justify-content: center;
      gap: 22px;
      animation: enter .8s .24s cubic-bezier(.16,1,.3,1) both;
    }

    .quiet a {
      color: #494949;
      font-size: 10px;
      letter-spacing: .02em;
      text-decoration: none;
      transition: color .25s ease;
    }

    .quiet a:hover { color: #999; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 620px) {
      h1 { font-size: clamp(3.2rem, 18vw, 5rem); }
      .tagline { margin-bottom: 50px; }
      nav { flex-direction: column; gap: 17px; }
      nav span { display: none; }
      nav a { font-size: 15px; }
      .quiet { margin-top: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="page">
      <h1 onclick="cloak()">mathstudies</h1>
      <p class="tagline">IF THIS SITE EVER GOES DOWN IN SCHOOL JUST OPEN THIS AT HOME itll be fixed shortly and there will be a backup</p>

      <nav aria-label="Main navigation">
        <a href="hmm.html">Games</a><span>/</span>
        <a href="coding/procy.html">Proxy</a><span>/</span>
        <a href="suggest.html">Suggest</a><span>/</span>
        <a href="guide.html">Guides</a><span>/</span>
      </nav>

      <div class="quiet">
        <a href="/os">OS mode</a>
        <a href="javascript:cloak()">Hide URL</a>
      </div>
    </section>
  </main>

  <script>
    function cloak() {
      const win = window.open('about:blank', '_blank');
      if (!win) return;
      const iframe = win.document.createElement('iframe');
      iframe.src = window.location.origin + '/home.html';
      iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
      win.document.body.style.margin = '0';
      win.document.body.appendChild(iframe);
      window.location.replace('https://google.com');
    }
  </script>
</body>
</html>
