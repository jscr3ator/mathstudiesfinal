<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | mathstudies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9fafb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #3b82f6;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    .shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #f3f4f6;
    }

    .content {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .intro {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .intro h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .intro p {
      color: var(--muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 500px;
    }

    .game-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      aspect-ratio: 1;
      min-height: 200px;
    }

    .game-tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .game-tile-img {
      width: 100%;
      height: 70%;
      object-fit: cover;
      background: #f3f4f6;
    }

    .game-tile-info {
      padding: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-tile-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .game-tile-by {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 12px;
      width: min(90vw, 1000px);
      height: min(90vh, 700px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.2rem;
    }

    .modal-close {
      font-size: 1.5rem;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: #f3f4f6;
    }

    .modal-iframe {
      flex: 1;
      overflow: hidden;
    }

    .modal-iframe iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      text-align: center;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .suggest-btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .suggest-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="header">
      <h1>Community Games</h1>
      <a href="hmm.html" class="back-btn">Back</a>
    </div>

    <div class="content">
      <div class="intro">
        <h2>Community Wanted Games</h2>
        <p>Games requested by the community. Click any to play!</p>
      </div>

      <div class="grid" id="gameGrid">
        <div class="game-tile" onclick="openGame('PokePath', 'https://pokepath-game.pages.dev/')">
          <img class="game-tile-img" src="community/pokepath.png" alt="PokePath">
          <div class="game-tile-info">
            <div class="game-tile-name">PokePath</div>
            <div class="game-tile-by">suggested by: unknown</div>
          </div>
        </div>
      </div>
    </div>
    <div class="grid" id="gameGrid">
        <div class="game-tile" onclick="openGame('HistorySpot', 'https://historyspot.com/activities')">
          <img class="game-tile-img" src="community/historyspot.png" alt="HistorySpot">
          <div class="game-tile-info">
            <div class="game-tile-name">HistorySpot</div>
            <div class="game-tile-by">suggested by: unknown</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <a href="suggest.html" class="suggest-btn">Want your own? Suggest here</a>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="gameTitle">Game</h2>
        <button class="modal-close" onclick="closeGame()">✕</button>
      </div>
      <div class="modal-iframe">
        <iframe id="gameIframe"></iframe>
      </div>
    </div>
  </div>

  <script>
    function openGame(name, url) {
      document.getElementById('gameTitle').textContent = name;
      document.getElementById('gameIframe').src = url;
      document.getElementById('gameModal').classList.add('active');
    }

    function closeGame() {
      document.getElementById('gameModal').classList.remove('active');
      document.getElementById('gameIframe').src = '';
    }

    // Close on ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeGame();
    });
  </script>
</body>

</html>
