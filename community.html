<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Community Games | mathstudies</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 20px; margin-top: 40px; }
    .tile { display: block; width: 100%; text-align: left; }
    .tile img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); transition: border-color .15s var(--ease), opacity .15s var(--ease); }
    .tile-info { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px; }
    .tile-name { font-size: 16px; font-weight: 500; transition: transform .2s var(--ease); }
    .tile:hover img { border-color: var(--line-hot); opacity: .88; }
    .tile:hover .tile-name { transform: translateX(3px); }
    .tile:hover .meta { color: var(--dim); }

    .modal-box.player { width: min(100%, 1100px); height: min(760px, calc(100svh - 40px)); }
    .player-frame { flex: 1; min-height: 0; }
    .player-frame iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  </style>
</head>
<body>
  <main class="page wide">
    <div class="top">
      <span><a class="link" href="home.html">mathstudies</a> / <a class="link" href="hmm.html">games</a> / community</span>
      <a class="link" href="hmm.html">back</a>
    </div>

    <h1 class="title">Community</h1>
    <p class="note">A small collection of games requested by the community.</p>

    <section class="grid" aria-label="Community game library">
      <button class="tile" onclick="openGame('PokePath', '/coding/poke/', 'https://pokepath-game.pages.dev/')">
        <img src="community/pokepath.png" alt="" loading="lazy">
        <span class="tile-info"><span class="tile-name">PokePath</span><span class="meta">suggested by unknown</span></span>
      </button>
      <button class="tile" onclick="openGame('HistorySpot', 'https://historyspot.com/activities')">
        <img src="community/historyspot.png" alt="" loading="lazy">
        <span class="tile-info"><span class="tile-name">HistorySpot</span><span class="meta">suggested by unknown</span></span>
      </button>
    </section>

    <footer class="foot">
      <span>want yours here?</span>
      <div class="links"><a class="link" href="suggest.html">suggest a game →</a></div>
    </footer>
  </main>

  <div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="gameTitle" hidden>
    <div class="modal-box player">
      <div class="modal-head"><h2 id="gameTitle">Game</h2><button onclick="closeGame()" aria-label="Close">close · esc</button></div>
      <div class="player-frame"><iframe id="gameIframe" title="Community game"></iframe></div>
    </div>
  </div>

  <script>
    const gameModal = document.getElementById('gameModal');
    const gameIframe = document.getElementById('gameIframe');
    gameIframe.addEventListener('load', () => {
      try {
        const text = gameIframe.contentDocument?.body?.textContent || '';
        if (gameIframe.dataset.fallback && /Cannot GET|NOT_FOUND|Page not found/i.test(text)) {
          gameIframe.src = gameIframe.dataset.fallback;
          delete gameIframe.dataset.fallback;
        }
      } catch {}
    });
    function openGame(name, url, fallback = '') {
      document.getElementById('gameTitle').textContent = name;
      gameIframe.dataset.fallback = fallback;
      gameIframe.src = url;
      gameModal.hidden = false;
    }
    function closeGame() {
      gameModal.hidden = true;
      gameIframe.src = '';
      delete gameIframe.dataset.fallback;
    }
    gameModal.addEventListener('click', event => { if (event.target === gameModal) closeGame(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeGame(); });
  </script>
</body>
</html>
